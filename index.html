<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>פיתוח יישומי אינטרנט — סיכום, תרגול ומבחן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Assistant:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#f4f6fb; --bg2:#eef1f8; --panel:#ffffff; --panel2:#f7f9fd;
  --line:#e2e7f0; --line2:#cfd7e6;
  --ink:#1a2234; --ink-soft:#55617a; --drop:#8794ab;
  --accent:#3a63d0; --accent-wash:#eaf0fc;
  --flag:#c85a26; --flag-wash:#fbeee5;
  --warn:#9a6b00; --warn-wash:#fbf3dd;
  --ok:#1f8f68; --ok-wash:#e6f4ee;
  --card:#ffffff; --rule:#e2e7f0;
  /* categorical topic hues (like a Tableau legend) */
  --t0:#0f9b8e; --t1:#3a63d0; --t2:#8b4fd6; --t3:#c77a12; --t4:#d0454f; --t5:#1f9d63;
  --t6:#b5348a; --t7:#c0392b; --t8:#2d7d9a; --t9:#5b6470;
  --paper:#f4f6fb;
}
*{box-sizing:border-box}
html,body{overflow-x:hidden;background-color:#f4f6fb}
html{color-scheme:light}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--ink);
  font-family:'Assistant',system-ui,sans-serif;font-size:16.5px;line-height:1.72;
  background:
    radial-gradient(1100px 560px at 82% -8%, rgba(58,99,208,.06), transparent 60%),
    radial-gradient(820px 460px at 6% 3%, rgba(139,79,214,.05), transparent 55%),
    var(--bg);
  min-height:100vh;
  padding-bottom:5rem;
}
.wrap{max-width:840px;margin:0 auto;padding:0 1.15rem}
.en,code{font-family:'IBM Plex Mono',monospace;font-size:.86em;
  direction:ltr;unicode-bidi:isolate;overflow-wrap:anywhere}
code{background:#eef1f8;padding:.05em .32em;border-radius:3px;
  border:1px solid var(--line);color:#2a3550}

/* ---------- masthead ---------- */
header{padding:2.6rem 0 1.4rem;position:relative}
header::after{content:"";position:absolute;bottom:0;inset-inline:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--line2),transparent)}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 .55rem}
h1{font-family:'Fraunces',Georgia,serif;font-weight:900;
  font-size:clamp(2rem,6.2vw,3rem);line-height:1.1;margin:0 0 .5rem;
  letter-spacing:-.015em;
  background:linear-gradient(115deg,#1a2234 30%,#3a63d0);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{margin:0;color:var(--ink-soft);font-size:1.02rem}
.facts{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:1.1rem}
.fact{font-family:'IBM Plex Mono',monospace;font-size:.72rem;font-weight:500;
  border:1px solid var(--line);background:var(--panel);padding:.32rem .68rem;
  border-radius:999px;color:var(--ink-soft)}
.fact.hot{border-color:rgba(240,134,58,.5);color:var(--flag);background:var(--flag-wash)}

/* ---------- mode toggle ---------- */
.modebar{position:sticky;top:0;z-index:40;
  background:rgba(244,246,251,.85);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:.6rem 0}
.modeinner{max-width:840px;margin:0 auto;padding:0 1.15rem;
  display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:.2rem;gap:.2rem}
.seg button{font-family:'Assistant',sans-serif;font-size:.85rem;font-weight:600;
  color:var(--ink-soft);background:none;border:none;cursor:pointer;
  padding:.4rem .85rem;border-radius:7px;transition:.15s}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.spacer{flex:1}
.scorepill{font-family:'IBM Plex Mono',monospace;font-size:.75rem;font-weight:600;
  background:var(--panel);border:1px solid var(--line);color:var(--ink);
  padding:.3rem .62rem;border-radius:8px}
.scorepill.good{border-color:var(--ok);color:var(--ok)}
.pbar{flex-basis:120px;flex-grow:.3;height:6px;background:#e6eaf2;
  border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.pbar span{display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--accent),var(--ok));transition:width .35s}
.ghost{font-family:'Assistant',sans-serif;font-size:.76rem;background:none;
  border:1px solid var(--line);color:var(--drop);padding:.3rem .6rem;
  border-radius:8px;cursor:pointer}
.ghost:hover{border-color:var(--flag);color:var(--flag)}

/* ---------- study: tabs ---------- */
nav.tabs{display:flex;gap:.35rem;overflow-x:auto;padding:1rem 0 0;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{font-family:'Assistant',sans-serif;font-size:.86rem;font-weight:600;
  white-space:nowrap;background:var(--panel);border:1px solid var(--line);
  color:var(--ink-soft);padding:.5rem .85rem;border-radius:10px;cursor:pointer;
  display:flex;align-items:center;gap:.5rem;transition:.15s;position:relative}
.tab:hover{color:var(--ink);border-color:var(--line2)}
.tab .dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.tab[aria-selected="true"]{color:var(--ink);background:var(--panel2);border-color:var(--line2)}
.tab[aria-selected="true"]::after{content:"";position:absolute;inset-inline:.7rem;
  bottom:-1px;height:2px;border-radius:2px;background:var(--tc,var(--accent))}
.tab .n{font-family:'IBM Plex Mono',monospace;font-size:.64rem;
  background:#eef1f8;color:var(--ink-soft);padding:.05rem .32rem;
  border-radius:5px;font-weight:600}
.tc0{--tc:var(--t0)}.tc1{--tc:var(--t1)}.tc2{--tc:var(--t2)}
.tc3{--tc:var(--t3)}.tc4{--tc:var(--t4)}.tc5{--tc:var(--t5)}
.tc6{--tc:var(--t6)}.tc7{--tc:var(--t7)}.tc8{--tc:var(--t8)}
.tc9{--tc:var(--t9)}
.tab.tc0 .dot{background:var(--t0)}.tab.tc1 .dot{background:var(--t1)}
.tab.tc2 .dot{background:var(--t2)}.tab.tc3 .dot{background:var(--t3)}
.tab.tc4 .dot{background:var(--t4)}.tab.tc5 .dot{background:var(--t5)}
.tab.tc6 .dot{background:var(--t6)}.tab.tc7 .dot{background:var(--t7)}
.tab.tc8 .dot{background:var(--t8)}
.tab.tc9 .dot{background:var(--t9)}
.tabline{height:1px;background:var(--line);margin-bottom:1.6rem}
.panel[hidden]{display:none}

/* ---------- part headers ---------- */
.part{display:flex;align-items:center;gap:.7rem;margin:0 0 1.1rem;
  padding-bottom:.55rem;border-bottom:1px solid var(--line)}
.part .lbl{font-family:'IBM Plex Mono',monospace;font-size:.64rem;font-weight:600;
  letter-spacing:.1em;padding:.22rem .55rem;border-radius:6px;white-space:nowrap;
  background:var(--tc,var(--accent));color:#fff}
.part.b .lbl{background:var(--flag);color:#fff}
.part h2{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:1.4rem;
  margin:0;border:none;padding:0;color:var(--ink)}
.part.b{margin-top:2.8rem}
.topline{margin:-.3rem 0 1.5rem;color:var(--ink-soft);font-size:.93rem}
.topline b{color:var(--ink)}

/* ---------- theory boxes (reused markup; restyled for dark) ---------- */
h3{font-family:'Assistant',sans-serif;font-weight:700;font-size:1.08rem;
  margin:1.9rem 0 .5rem;color:var(--ink)}
h3.star::before{content:"★";color:var(--flag);margin-inline-end:.4rem;font-size:.9em}
.wrap p{margin:.5rem 0}
.wrap ul,.wrap ol{margin:.5rem 0;padding-inline-start:1.3rem}
.wrap li{margin:.3rem 0}
.wrap li::marker{color:var(--accent)}
strong{font-weight:700;color:#0f1626}
em{font-style:normal;background:linear-gradient(transparent 60%,rgba(91,141,239,.28) 0);padding:0 .1em}
.box{border-inline-start:3px solid var(--accent);background:var(--panel);
  padding:.85rem 1rem;margin:1rem 0;border-radius:0 10px 10px 0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  border-inline-end:1px solid var(--line)}
.box.must{border-inline-start-color:var(--flag);background:var(--flag-wash)}
.box.trap{border-inline-start-color:var(--warn);background:var(--warn-wash)}
.box.drop{border-inline-start-color:var(--drop);background:#f7f9fd;color:var(--ink-soft)}
.box p:first-child{margin-top:0}.box p:last-child{margin-bottom:0}
.insights{margin:1.4rem 0 .5rem;padding:1rem 1.15rem;border-radius:12px;
  background:linear-gradient(180deg,#eef4fb,var(--panel));
  border:1px solid var(--line2);border-inline-start:4px solid var(--tc,var(--accent))}
.insights-h{font-family:'Fraunces',serif;font-size:1.02rem;font-weight:600;
  color:var(--ink);margin-bottom:.2rem}
.insights-sub{font-size:.8rem;color:var(--ink-soft);margin:.1rem 0 .6rem}
.insights ul{margin:0;padding-inline-start:1.1rem;list-style:none}
.insights li{position:relative;padding:.32rem 0 .32rem .2rem;font-size:.9rem;
  line-height:1.55;border-bottom:1px dashed var(--line);color:var(--ink)}
.insights li:last-child{border-bottom:none}
.insights li::before{content:"◂";color:var(--tc,var(--accent));
  position:absolute;inset-inline-start:-1rem;font-size:.7rem;top:.55rem}
.box-label{font-family:'IBM Plex Mono',monospace;font-size:.66rem;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:.35rem;color:var(--accent)}
.must .box-label{color:var(--flag)}.trap .box-label{color:var(--warn)}.drop .box-label{color:var(--drop)}

.scroll{overflow-x:auto;margin:1.1rem 0;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.9rem;background:var(--panel)}
th,td{border:1px solid var(--line);padding:.55rem .7rem;text-align:right;vertical-align:top;color:var(--ink)}
thead th{background:var(--panel2);color:#0f1626;font-weight:600;font-size:.82rem;white-space:nowrap}
tbody tr:nth-child(even){background:#fafbfe}
td strong{color:var(--accent)}

.flow{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;background:var(--panel2);
  border:1px solid var(--line);padding:.9rem;border-radius:10px;margin:1rem 0}
.flow span{font-family:'IBM Plex Mono',monospace;font-size:.78rem;font-weight:600;
  background:var(--accent-wash);color:#2a4aa0;padding:.32rem .55rem;border-radius:6px;direction:ltr}
.flow i{color:var(--drop);font-style:normal;font-weight:700}

ol.steps{counter-reset:s;list-style:none;padding:0;margin:1rem 0}
ol.steps li{counter-increment:s;position:relative;padding-inline-start:2.1rem;margin:.5rem 0}
ol.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:.15rem;
  font-family:'IBM Plex Mono',monospace;font-size:.7rem;font-weight:600;
  width:1.45rem;height:1.45rem;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center}
.check{list-style:none;padding:0;margin:1rem 0}
.check li{padding:.55rem .8rem;margin:.3rem 0;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;display:flex;gap:.65rem;
  align-items:flex-start;font-size:.95rem;min-width:0;overflow-wrap:anywhere}
.check li::before{content:"";flex:0 0 auto;width:1rem;height:1rem;margin-top:.3rem;
  border:1.5px solid var(--accent);border-radius:4px}

/* ---------- questions ---------- */
.q{background:linear-gradient(180deg,var(--panel),var(--bg2));
  border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.15rem;margin-bottom:1rem;
  box-shadow:0 12px 30px -18px rgba(26,34,52,.18)}
.q-top{display:flex;align-items:baseline;gap:.6rem;margin-bottom:.6rem;flex-wrap:wrap}
.q-num{font-family:'IBM Plex Mono',monospace;font-size:.68rem;font-weight:600;
  color:var(--accent);letter-spacing:.08em}
.lvl{font-family:'IBM Plex Mono',monospace;font-size:.6rem;font-weight:600;
  padding:.14rem .42rem;border-radius:5px}
.lvl.easy{background:var(--ok-wash);color:var(--ok)}
.lvl.mid{background:var(--warn-wash);color:var(--warn)}
.lvl.hard{background:var(--flag-wash);color:var(--flag)}
.q-badge{font-family:'IBM Plex Mono',monospace;font-size:.6rem;font-weight:600;
  padding:.14rem .45rem;border-radius:5px;background:#eef1f8;color:var(--ink-soft);
  display:inline-flex;align-items:center;gap:.3rem}
.q-badge .dot{width:7px;height:7px;border-radius:2px}
.starbtn{margin-inline-start:auto;background:none;border:none;cursor:pointer;font-size:1.15rem;line-height:1;color:var(--line2);padding:.1rem .2rem;transition:.15s;border-radius:6px}
.starbtn:hover{color:var(--warn);transform:scale(1.15)}
.starbtn.on{color:var(--warn)}
.tstat{font-family:'IBM Plex Mono',monospace;font-size:.62rem;font-weight:600;padding:.05rem .3rem;border-radius:5px;margin-inline-start:.1rem}
.tstat:empty{display:none}
.tstat.green{background:var(--ok-wash);color:var(--ok)}
.tstat.yellow{background:var(--warn-wash);color:var(--warn)}
.tstat.red{background:var(--flag-wash);color:var(--flag)}
#review[hidden]{display:none}
#dash[hidden],#cards[hidden]{display:none}

/* ---------- Study plan card ---------- */
.plan-card{background:linear-gradient(135deg,#20325c,#2f4a86);color:#fff;border-radius:18px;
  padding:1.25rem 1.4rem;margin-bottom:1.1rem;box-shadow:0 4px 18px rgba(20,40,90,.18);position:relative}
.plan-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.7rem}
.plan-count{display:flex;align-items:baseline;gap:.5rem}
.plan-days{font-family:'Fraunces',serif;font-weight:900;font-size:2.4rem;line-height:1;color:#fff}
.plan-dl{font-size:.9rem;color:rgba(255,255,255,.8)}
.plan-setexam{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25);
  border-radius:20px;padding:.3rem .7rem;font:inherit;font-size:.76rem;cursor:pointer}
.plan-setexam:hover{background:rgba(255,255,255,.24)}
.plan-mid{margin-bottom:.9rem}
.plan-title{font-family:'Fraunces',serif;font-weight:700;font-size:1.2rem;margin-bottom:.2rem}
.plan-sub{font-size:.86rem;color:rgba(255,255,255,.82);line-height:1.45}
.plan-go{width:100%;background:#fff;color:#22345c;border:none;font-weight:700}
.plan-go:hover{background:#eef2fb}
.plan-streak{display:inline-block;margin-top:.8rem;background:rgba(255,180,60,.2);
  color:#ffd38a;font-size:.82rem;font-weight:700;padding:.25rem .7rem;border-radius:14px}

/* ---------- Dashboard ---------- */
.dash-hero{display:flex;gap:1.3rem;align-items:center;flex-wrap:wrap;
  background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:1.4rem 1.5rem;margin-bottom:1.1rem}
.ring{--p:0;width:130px;height:130px;border-radius:50%;flex:0 0 auto;position:relative;
  background:conic-gradient(var(--rc) calc(var(--p)*1%), var(--line) 0)}
.ring-in{position:absolute;inset:11px;background:var(--bg);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-num{font-family:'Fraunces',serif;font-weight:900;font-size:1.85rem;color:var(--ink);line-height:1}
.ring-lbl{font-size:.72rem;color:var(--ink-soft);margin-top:.15rem;letter-spacing:.03em}
.hero-side{flex:1;min-width:230px}
.hero-side h2{font-family:'Fraunces',serif;font-weight:900;font-size:1.5rem;margin:0 0 .3rem}
.hero-sub{margin:0 0 .9rem;color:var(--ink-soft);font-size:.92rem;line-height:1.5}
.hero-btns{display:flex;gap:.5rem;flex-wrap:wrap}
.btn.primary{background:var(--accent);color:#fff;border:none;box-shadow:0 2px 8px rgba(20,40,90,.16)}
.btn.ghost2{background:var(--panel2);color:var(--ink);border:1px solid var(--line2)}
.statechips{display:flex;gap:.5rem;flex-wrap:wrap;margin:0 0 1.5rem}
.chip{font-size:.82rem;padding:.4rem .75rem;border-radius:20px;border:1px solid var(--line2);background:var(--panel)}
.chip b{font-weight:800;margin-inline-end:.15rem}
.chip.c-mastered{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,var(--line2))}
.chip.c-learning{color:var(--t1)}
.chip.c-weak{color:var(--flag);border-color:color-mix(in srgb,var(--flag) 35%,var(--line2))}
.chip.c-new{color:var(--ink-soft)}
.dash-h{font-family:'Fraunces',serif;font-weight:700;font-size:1.15rem;margin:1.4rem 0 .7rem}
.mastery-list{display:flex;flex-direction:column;gap:.4rem}
.mrow{display:flex;align-items:center;gap:.6rem;width:100%;text-align:start;cursor:pointer;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.6rem .8rem;font:inherit;color:inherit}
.mrow:hover{border-color:var(--line2);background:var(--panel2)}
.mrow-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.mrow-name{flex:1;font-size:.9rem;font-weight:600;min-width:0}
.mrow-weak{font-size:.7rem;color:var(--flag);background:var(--flag-wash);padding:.05rem .35rem;border-radius:6px;font-weight:700;margin-inline-start:.3rem;white-space:nowrap}
.mrow-bar{flex:0 0 90px;height:8px;background:var(--line);border-radius:5px;overflow:hidden}
.mrow-bar span{display:block;height:100%;border-radius:5px;transition:width .5s}
.mrow-pct{flex:0 0 auto;font-family:'IBM Plex Mono',monospace;font-size:.78rem;font-weight:700;width:2.8em;text-align:end}
.exhist{display:flex;gap:.5rem;align-items:flex-end;height:120px;padding:.5rem;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.exbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:.2rem}
.exbar-fill{width:70%;max-width:34px;border-radius:5px 5px 0 0;min-height:6px}
.exbar-pct{font-family:'IBM Plex Mono',monospace;font-size:.65rem;font-weight:700;color:var(--ink-soft)}
.exbar-d{font-size:.6rem;color:var(--drop)}
.tipbox{margin-top:1.6rem;background:var(--flag-wash);border:1px solid color-mix(in srgb,var(--flag) 22%,var(--line2));border-radius:14px;padding:1rem 1.2rem}
.tipbox-h{font-family:'Fraunces',serif;font-weight:700;font-size:1.02rem;margin-bottom:.4rem}
.tipbox ol{margin:0;padding-inline-start:1.2rem;font-size:.88rem;line-height:1.7;color:var(--ink)}
.smart-done{text-align:center;margin-top:1.4rem;padding:1.2rem;background:var(--panel);border:1px solid var(--line2);border-radius:14px;font-size:1.05rem}
.smart-done .btn{margin-top:.7rem}

/* ---------- Flashcards ---------- */
.fc-top h2{font-family:'Fraunces',serif;font-weight:900;font-size:1.6rem;margin:0 0 .3rem}
.fc-sub{margin:0 0 .8rem;color:var(--ink-soft);font-size:.9rem}
.fc-filter{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.2rem}
.fcf{font:inherit;font-size:.78rem;padding:.32rem .6rem;border-radius:16px;border:1px solid var(--line2);
  background:var(--panel);color:var(--ink-soft);cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}
.fcf.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fcf-dot{width:8px;height:8px;border-radius:50%}
.fc-counter{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--ink-soft);margin-bottom:.6rem}
.fc-card{perspective:1400px;cursor:pointer;margin:0 auto 1rem;max-width:520px;height:290px}
.fc-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc-card.flip .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:1.5rem;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  border:1px solid var(--line2);box-shadow:0 4px 18px rgba(20,40,90,.08)}
.fc-front{background:var(--panel)}
.fc-back{background:linear-gradient(160deg,var(--panel2),var(--panel));transform:rotateY(180deg);overflow-y:auto}
.fc-tag{color:#fff;font-size:.68rem;font-weight:700;padding:.2rem .6rem;border-radius:12px;margin-bottom:1rem;letter-spacing:.03em}
.fc-q{font-family:'Fraunces',serif;font-weight:700;font-size:1.35rem;line-height:1.4;color:var(--ink)}
.fc-hint{position:absolute;bottom:1rem;font-size:.72rem;color:var(--drop)}
.fc-a{font-size:.94rem;line-height:1.6;color:var(--ink)}
.fc-nav{display:flex;gap:.6rem;justify-content:center;max-width:520px;margin:0 auto}
.fc-nav .btn{flex:1}
.fc-shuffle{display:block;margin:.8rem auto 0;font:inherit;font-size:.82rem;background:none;border:none;color:var(--ink-soft);cursor:pointer;text-decoration:underline}
.fc-empty{text-align:center;color:var(--ink-soft);padding:2rem}

.review-head{margin-bottom:1.6rem}
.review-head h2{font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:1.7rem;margin:0 0 .4rem}
.review-head p{margin:0;color:var(--ink-soft);font-size:.96rem;max-width:60ch}
.review-empty{text-align:center;padding:3rem 1.5rem;background:var(--panel);border:1px solid var(--line);border-radius:16px}
.review-empty .ic{width:56px;height:56px;border-radius:50%;margin:0 auto 1rem;display:grid;place-items:center;font-size:1.6rem;background:var(--ok-wash);color:var(--ok)}
.review-empty h3{font-family:'Fraunces',serif;font-weight:700;font-size:1.3rem;margin:0 0 .5rem}
.review-empty p{color:var(--ink-soft);margin:0;line-height:1.7}
.q-text{margin:0 0 .85rem;font-weight:600;line-height:1.62;font-size:1.02rem}
.scenario{display:block;background:#f2f5fb;
  border-inline-start:2px solid var(--line2);padding:.55rem .75rem;margin-bottom:.6rem;
  font-weight:400;font-size:.93rem;color:var(--ink-soft);border-radius:0 8px 8px 0}
.opts{list-style:none;padding:0;margin:0}
.opts li{margin:.4rem 0}
.opt{width:100%;text-align:start;font-family:'Assistant',sans-serif;font-size:.96rem;
  background:var(--panel2);border:1px solid var(--line);border-radius:11px;
  padding:.65rem .8rem;cursor:pointer;display:flex;gap:.65rem;align-items:flex-start;
  line-height:1.5;color:var(--ink);transition:.15s}
.opt:hover:not(:disabled){border-color:var(--tc,var(--accent));

.opt:disabled{cursor:default}
.opt .k{font-family:'IBM Plex Mono',monospace;font-size:.74rem;font-weight:600;

  margin-top:.05rem;background:var(--bg);border:1px solid var(--line2);color:var(--ink-soft)}
.opt.correct,.opt.reveal{border-color:var(--ok);background:var(--ok-wash)}
.opt.correct .k,.opt.reveal .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--flag);background:var(--flag-wash)}
.opt.wrong .k{background:var(--flag);color:#fff;border-color:var(--flag)}
.why{margin-top:.75rem;padding:.75rem .85rem;background:var(--accent-wash);
  border-inline-start:3px solid var(--accent);border-radius:0 10px 10px 0;
  font-size:.93rem;line-height:1.58}
.why[hidden]{display:none}
.why b{color:#2a4aa0}
.why .tag{font-family:'IBM Plex Mono',monospace;font-size:.62rem;font-weight:600;
  letter-spacing:.06em;color:var(--accent);display:block;margin-bottom:.3rem}
.why.miss{background:var(--flag-wash);border-inline-start-color:var(--flag)}
.why.miss .tag,.why.miss b{color:var(--flag)}
.done{background:var(--ok-wash);border:1px solid var(--ok);border-radius:12px;
  padding:1rem;margin-top:1.1rem;text-align:center;color:var(--ink)}
.done[hidden]{display:none}

/* ---------- exam mode ---------- */
#exam[hidden]{display:none}
.exam-start{background:linear-gradient(180deg,var(--panel),var(--bg2));
  border:1px solid var(--line2);border-radius:16px;padding:2rem 1.6rem;text-align:center;
  box-shadow:0 16px 40px -20px rgba(26,34,52,.16)}
.exam-start h2{font-family:'Fraunces',serif;font-weight:900;font-size:1.8rem;margin:0 0 .5rem}
.exam-start p{color:var(--ink-soft);max-width:44ch;margin:.4rem auto}
.exam-legend{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin:1.3rem 0}
.exam-legend span{font-family:'IBM Plex Mono',monospace;font-size:.72rem;font-weight:500;
  border:1px solid var(--line);background:var(--panel2);padding:.35rem .65rem;
  border-radius:999px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:.4rem}
.exam-legend .dot{width:8px;height:8px;border-radius:2px}
.btn{font-family:'Assistant',sans-serif;font-size:1rem;font-weight:700;
  background:linear-gradient(120deg,var(--accent),#4a7de0);color:#fff;border:none;
  padding:.85rem 2rem;border-radius:12px;cursor:pointer;margin-top:.6rem;
  box-shadow:0 12px 28px -12px var(--accent);transition:.15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 34px -12px var(--accent)}
.btn.sm{font-size:.85rem;padding:.55rem 1.1rem}

.exam-hud{position:sticky;top:56px;z-index:30;display:flex;align-items:center;gap:.8rem;
  background:rgba(255,255,255,.9);backdrop-filter:blur(10px);
  border:1px solid var(--line2);border-radius:12px;padding:.6rem .9rem;margin-bottom:1.2rem}
.timer{font-family:'IBM Plex Mono',monospace;font-size:1.05rem;font-weight:600;color:var(--ink)}
.timer.warn{color:var(--flag)}
.timer .lb{font-size:.6rem;color:var(--drop);display:block;letter-spacing:.1em}
.hud-prog{flex:1;height:6px;background:#e6eaf2;border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.hud-prog span{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.hud-count{font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--ink-soft)}

.result{background:linear-gradient(180deg,var(--panel),var(--bg2));
  border:1px solid var(--line2);border-radius:16px;padding:2rem 1.6rem;text-align:center}
.result .ring{width:130px;height:130px;border-radius:50%;margin:0 auto 1rem;
  display:grid;place-items:center;position:relative;
  background:conic-gradient(var(--rc,var(--ok)) calc(var(--v,0)*1%),var(--line) 0)}
.result .ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--panel)}
.result .ring b{position:relative;font-family:'Fraunces',serif;font-size:2.1rem;color:var(--ink)}
.result .ring b small{display:block;font-family:'IBM Plex Mono',monospace;font-size:.65rem;
  color:var(--ink-soft);font-weight:400;letter-spacing:.1em}
.result h2{font-family:'Fraunces',serif;font-weight:900;font-size:1.7rem;margin:.3rem 0}
.result .verdict{color:var(--ink-soft);margin-bottom:1.2rem}
.breakdown{display:grid;gap:.5rem;text-align:start;margin:1.2rem 0;
  max-width:420px;margin-inline:auto}
.brow{display:flex;align-items:center;gap:.6rem;background:var(--panel2);
  border:1px solid var(--line);border-radius:9px;padding:.5rem .7rem;font-size:.88rem}
.brow .dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.brow .nm{flex:1;font-weight:600}
.brow .sc{font-family:'IBM Plex Mono',monospace;font-size:.82rem;color:var(--ink-soft)}
.result .btn{margin:.4rem .3rem}

@media (max-width:520px){
  .q{padding:.85rem .8rem}
  .opt{font-size:.92rem}
  .part h2{font-size:1.2rem}
  .exam-hud{top:52px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

<script>
const THEORY = ["<p><strong>מהי אפליקציית Web?</strong> אפליקציה שה<em>ממשק</em> שלה (UI) מבוסס דפדפן נקראת <span class=\"en\">Web Application</span>. כמעט כל מערכות המידע המודרניות הן אפליקציות Web. המשתמש ניגש דרך דפדפן, בלי להתקין תוכנה.</p>\n<div class=\"box\"><span class=\"box-label\">יתרונות וחסרונות של אפליקציית Web</span>\n<p><strong>יתרונות:</strong> מבוזרת דרך האינטרנט; רצה על כל סוג מחשב (PC, טאבלט, סמארטפון); על כל מערכת הפעלה; <strong>ללא התקנה</strong>; קלה לעדכון (מעדכנים בשרת וכולם מקבלים מיד).</p>\n<p><strong>חסרונות:</strong> תלויה ברוחב פס (<span class=\"en\">Bandwidth</span>); קשה יותר לניפוי שגיאות (<span class=\"en\">Debug</span>).</p></div>\n<div class=\"box must\"><span class=\"box-label\">★ Front-end מול Back-end מול Full-stack</span>\n<p>ההבחנה הבסיסית של הקורס:</p><ul>\n<li><strong><span class=\"en\">Front-end</span>:</strong> החלק שרץ ב<em>דפדפן</em> (אצל המשתמש). אחראי על ה-UI ולוגיקה בצד הלקוח. בנוי מ-<span class=\"en\">HTML + CSS + JS</span>.</li>\n<li><strong><span class=\"en\">Back-end</span>:</strong> החלק שרץ ב<em>שרת</em>. אחראי על מסד הנתונים, הלוגיקה העסקית, ועל <em>יצירת</em> ה-Front-end.</li>\n<li><strong><span class=\"en\">Full-stack</span>:</strong> מי שמפתח את שני הצדדים.</li></ul></div>\n<div class=\"box\"><span class=\"box-label\">HTML — שפת הסימון</span>\n<p><strong><span class=\"en\">HTML</span></strong> (<span class=\"en\">HyperText Markup Language</span>) היא השפה הנפוצה ביותר ב-IT — כל אתרי האינטרנט מבוססים עליה. מסמך HTML הוא <strong>טקסט בלבד</strong>, שהדפדפן <em>מעבד</em> (Rendering) כדי ליצור את הממשק.</p>\n<p>מאפיין ייחודי: HTML היא <strong>השפה היחידה בשימוש נרחב שסלחנית לשגיאות</strong> — אם יש שגיאה באלמנט, הדפדפן מנסה להציג את השאר, והמסמך <em>כן</em> מוצג. (נבחן!)</p></div>\n<div class=\"box\"><span class=\"box-label\">אלמנטים, תגיות ומאפיינים</span>\n<p><strong>אלמנט (<span class=\"en\">Element</span>):</strong> אבן הבניין. רובם: <strong>תג פתיחה + תוכן + תג סגירה</strong> — <code>&lt;p&gt;טקסט&lt;/p&gt;</code>. חלקם ריקים כמו <code>&lt;img&gt;</code> ו-<code>&lt;br&gt;</code>.</p>\n<p><strong>מאפיין (<span class=\"en\">Attribute</span>):</strong> מידע נוסף בתג הפתיחה כ-<code>שם=\"ערך\"</code>. למשל <code>&lt;img src=\"pic.gif\"&gt;</code>. מומלץ לשים ערך ב<strong>גרשיים</strong>.</p></div>\n<div class=\"box\"><span class=\"box-label\">אלמנט ה-DIV</span>\n<p><strong><span class=\"en\">DIV</span></strong> הוא אלמנט <em>גנרי</em> (container) ללא משמעות סמנטית — לחלוקת המסמך לאזורי עיצוב, או להגדרת חלקים עם גישה מ-JS. הוא אלמנט <strong>block</strong> (תופס שורה מלאה). אפשר להכניס לתוכו כל אלמנט אחר.</p></div>\n<div class=\"box trap\"><span class=\"box-label\">⚠ מלכודות ב-HTML</span>\n<p>• שגיאה באלמנט <strong>לא</strong> מונעת הצגת המסמך.<br>• אפשר לשים <code>&lt;img&gt;</code> בתוך <code>&lt;div&gt;</code>.<br>• אפשר כל פורמט תמונה (לא רק gif).<br>• לא כל מאפיין חייב ערך, אבל מומלץ.</p></div>",
"<p><strong>מהו HTML5?</strong> באוקטובר 2014 ה-<span class=\"en\">W3C</span> פרסם רשמית את HTML5 כתקן. המטרה המרכזית: להשתמש ב<strong>דפדפן כפלטפורמה</strong> להרצת יישומי Web (הדפדפן כסביבת הרצה), לא רק להצגת מסמכים.</p>\n<div class=\"box\"><span class=\"box-label\">פשטות ביחס ל-HTML4</span>\n<p>• <code>&lt;!DOCTYPE html&gt;</code> קצר, במקום ההכרזה הארוכה של HTML4.<br>• <code>&lt;meta charset=\"utf-8\"&gt;</code> קצר.<br>• אפשר לא לשים גרשיים לערכי מאפיינים (ברוב המקרים).<br>• הרבה אלמנטים <strong>לא דורשים תגית סגירה</strong>: <code>&lt;li&gt;</code>, <code>&lt;td&gt;</code>, <code>&lt;p&gt;</code> (ברוב המקרים), <code>&lt;body&gt;</code>, <code>&lt;html&gt;</code> ועוד.</p></div>\n<div class=\"box must\"><span class=\"box-label\">★ אלמנטים סמנטיים (Semantic Elements)</span>\n<p>אלמנטים חדשים ב-HTML5 שנותנים <em>משמעות</em> למבנה המסמך (במקום DIV גנרי): <code>&lt;header&gt;</code>, <code>&lt;footer&gt;</code>, <code>&lt;nav&gt;</code>, <code>&lt;main&gt;</code>, <code>&lt;article&gt;</code>, <code>&lt;section&gt;</code>, <code>&lt;aside&gt;</code>, <code>&lt;figure&gt;</code> + <code>&lt;figcaption&gt;</code>.</p>\n<p>ארבעת <code>article, section, nav, aside</code> נקראים <strong>Sectioning Elements</strong> — הם מחלקים את המסמך ל-\"sections\", וכל אחד יכול להכיל כותרת ומבנה משלו.</p></div>\n<div class=\"box\"><span class=\"box-label\">ARTICLE מול SECTION</span>\n<p>• <code>&lt;article&gt;</code> — תוכן ש<em>עומד בפני עצמו</em> (אפשר להשתמש בו לבד, למשל פוסט).<br>• <code>&lt;section&gt;</code> — חלק לוגי מתוך מסמך.<br>• <strong>שניהם יכולים להכיל זה את זה!</strong> article יכול להיות מורכב מ-sections, ו-section יכול להכיל articles.</p></div>\n<div class=\"box\"><span class=\"box-label\">האם DIV עדיין שימושי?</span>\n<p>כן. לאלמנטים הסמנטיים יש <em>משמעות</em>, אבל אם אף אלמנט סמנטי לא מתאים — <strong>רצוי להשתמש ב-DIV</strong>, למשל לחלוקת המסמך לאזורי עיצוב או להגדרת חלקים עם גישה מ-JS.</p></div>\n<div class=\"box\"><span class=\"box-label\">עיצוב רספונסיבי (Responsive Design)</span>\n<p><strong>עיצוב רספונסיבי</strong> = הדף מתאים את עצמו אוטומטית לגודל המסך (מחשב, טאבלט, טלפון). משיגים זאת עם <span class=\"en\">CSS Media Queries</span>, יחידות יחסיות (%, em, rem) ו-<span class=\"en\">meta viewport</span>. המטרה: חוויה טובה בכל מכשיר, בלי אתר נפרד לנייד.</p></div>",
"<p><strong>מהו CSS?</strong> <span class=\"en\">CSS</span> (<span class=\"en\">Cascading Style Sheets</span>) — שפת עיצוב שמפרידה בין ה<em>תוכן</em> (HTML) ל<em>עיצוב</em>. CSS3 נחשב חלק מ-HTML5, ומחולק למודולים עם רמות (Levels).</p>\n<div class=\"box must\"><span class=\"box-label\">★ שלושה מקומות להגדרות CSS</span>\n<p>סדר מהגרוע לטוב:</p><ul>\n<li><strong>Inline (בשורה) — לא מומלץ!</strong> <code>&lt;div style=\"color:red\"&gt;</code>. אין שימוש חוזר, אין הפרדה בין עיצוב לתוכן.</li>\n<li><strong>Internal (פנימי) — טוב יותר:</strong> <code>&lt;style&gt;...&lt;/style&gt;</code> ב-<code>&lt;head&gt;</code>. שימוש חוזר במסמך אחד בלבד.</li>\n<li><strong>External (חיצוני) — הכי טוב:</strong> <code>&lt;link href=\"style.css\"&gt;</code>. רמת שימוש חוזר גבוהה — קובץ אחד לכל האתר.</li></ul></div>\n<div class=\"box must\"><span class=\"box-label\">★ סלקטורים (Selectors)</span>\n<p>בוחרים אילו אלמנטים לעצב:</p><ul>\n<li><strong>Element selector:</strong> שם של אלמנט — <code>p { }</code> בוחר את כל ה-<code>&lt;p&gt;</code>.</li>\n<li><strong>Class selector:</strong> מתחיל בנקודה — <code>.box { }</code> בוחר אלמנטים עם <code>class=\"box\"</code>.</li>\n<li><strong>Id selector:</strong> מתחיל בסולמית — <code>#header { }</code> בוחר את האלמנט עם <code>id=\"header\"</code>.</li>\n<li><strong>Universal selector:</strong> כוכבית — <code>* { }</code> בוחר את הכול.</li></ul>\n<p>מתקדמים: <strong>Combinators</strong> (סלקטורים מורכבים לפי היררכיה), <strong>Attribute selectors</strong> (לפי מאפיינים), <strong>Pseudo-classes</strong> (כמו <code>:hover</code>), <strong>Pseudo-elements</strong> (כמו <code>::before</code>).</p></div>\n<div class=\"box must\"><span class=\"box-label\">★ ספציפיות (Specificity) — מי מנצח?</span>\n<p>כשכמה כללים חלים על אותו אלמנט, מנצח הכלל ה<em>ספציפי</em> יותר. סדר הכוח (מהחלש לחזק):</p>\n<p><strong>Element (p) &lt; Class (.box) &lt; Id (#header)</strong></p>\n<p>כלומר <strong>Id ספציפי יותר מ-Class</strong>, ו-Class ספציפי יותר משם אלמנט. דוגמה: אם <code>p { color:blue }</code> ו-<code>#header { color:red }</code> חלים על אותה פסקה עם <code>id=\"header\"</code> — היא תהיה <strong>אדומה</strong> (ה-Id מנצח). <span class=\"en\">Inline style</span> חזק אף יותר, ו-<code>!important</code> גובר על הכול.</p></div>\n<div class=\"box\"><span class=\"box-label\">צבעים ב-CSS</span>\n<p>אפשר להגדיר צבע במספר דרכים: שם (<code>red</code>), <span class=\"en\">HEX</span> (<code>#ff0000</code>), <span class=\"en\">RGB</span> (<code>rgb(255,0,0)</code>), <span class=\"en\">RGBA</span> (עם שקיפות), <span class=\"en\">HSL</span>. המאפיין <code>color</code> קובע צבע טקסט, <code>background-color</code> קובע צבע רקע.</p></div>\n<div class=\"box trap\"><span class=\"box-label\">⚠ מלכודת ספציפיות</span>\n<p>שאלה קלאסית: פסקה בתוך DIV. יש כלל על <code>#div1 p</code> וכלל על <code>p</code>. איזה מנצח? — <strong>הסלקטור עם ה-Id ספציפי יותר</strong> ולכן הוא קובע, ללא קשר לסדר הכתיבה בקובץ. ספציפיות מנצחת סדר.</p></div>",
"<p><strong>מהי JavaScript?</strong> שפת התכנות של הדפדפן. נוצרה ב-1995 על ידי <span class=\"en\">Brendan Eich</span> ב-Netscape תוך 10 ימים. השם JavaScript יוצר בלבול עם Java — אבל <strong>אין שום קשר בין השפות!</strong> התקן נקרא <span class=\"en\">ECMAScript</span> (בקיצור ES); גרסת ES6 (ES2015) היא אבן דרך מרכזית.</p>\n<div class=\"box must\"><span class=\"box-label\">★ תכונות של JavaScript</span>\n<p>• <strong>Interpreted</strong> (מפורשת, לרוב עם קומפילציה just-in-time).<br>• <strong>Multi-paradigm</strong> — פונקציונלית וגם מונחית עצמים (OOP).<br>• תחביר בסגנון Java (סוגריים מסולסלים).<br>• <strong>Dynamic typing</strong> (טיפוסים דינמיים) — לא מכריזים על סוג משתנה מראש.<br>• <strong>Prototype-based</strong> — OOP מבוסס prototype ולא class קלאסי.<br>• <strong>First-class functions</strong> — פונקציות הן ערכים (אפשר להעביר כפרמטר, להחזיר, לשמור במשתנה).</p></div>\n<div class=\"box must\"><span class=\"box-label\">★ משתנים ו-scope (מרחב הכרה)</span>\n<p><strong>מחוץ לפונקציה:</strong> ה-scope הוא כל מסמך ה-HTML (גלובלי).</p>\n<p><strong>בתוך פונקציה:</strong></p><ul>\n<li><code>var</code> — scope של הפונקציה כולה (מיושן, out of date).</li>\n<li><code>let</code> — scope של הבלוק <code>{ }</code> בלבד.</li>\n<li><code>const</code> — scope של הבלוק, אבל <strong>הערך לא ניתן לשינוי</strong>.</li></ul>\n<p>נקודות שנבחנות: למשתנים <strong>יש</strong> סוג נתונים (אבל דינמי — נקבע לפי הערך); <strong>אפשר</strong> להגדיר משתנה בתוך פונקציה; שמות משתנים <strong>לא</strong> יכולים להתחיל במספר.</p></div>\n<div class=\"box\"><span class=\"box-label\">טיפוסי נתונים (Data Types)</span>\n<p>הטיפוס נקבע דינמית לפי הערך, ובודקים אותו עם <code>typeof</code>:</p>\n<p><code>let a; // \"undefined\"</code><br><code>a = \"hello\"; // \"string\"</code><br><code>a = 42; // \"number\"</code><br><code>a = true; // \"boolean\"</code></p>\n<p>טיפוסים: <span class=\"en\">undefined, string, number, boolean, object, function, symbol, bigint</span>. אותו משתנה יכול להחזיק ערכים מטיפוסים שונים לאורך הריצה (dynamic typing).</p></div>\n<div class=\"box must\"><span class=\"box-label\">★ פונקציות ב-JavaScript</span>\n<p>• <strong>יכולה להיות פונקציה ללא שם</strong> (anonymous function) — למשל בתוך <code>fetch(...).then(...)</code>.<br>• פונקציות הן <strong>First-class</strong> — אפשר להעביר כארגומנט ולהחזיר מפונקציה.<br>• <strong>לא</strong> חייבים לקרוא לפונקציה מיד אחרי שהגדרנו אותה (בניגוד למלכודת).<br>• פונקציות <strong>לא</strong> חייבות להיות באותו קובץ.<br>• פרמטרים שהוגדרו <strong>לא</strong> חייבים לקבל ערך בקריאה — פרמטר חסר יהיה <code>undefined</code>.</p></div>",
"<p><strong>מהו DOM?</strong> <span class=\"en\">DOM</span> (<span class=\"en\">Document Object Model</span>) קובע את הכללים איך לעבוד עם מסמך HTML באמצעות JavaScript. הדפדפן ממיר את מסמך ה-HTML ל<strong>עץ אובייקטים</strong> (Tree) — כל אלמנט HTML הופך לאובייקט בעץ, ו-JS יכולה לגשת אליו ולשנות אותו.</p>\n<div class=\"box must\"><span class=\"box-label\">★ עץ ה-DOM</span>\n<p>המבנה היררכי: בשורש (root) יש את מסמך ה-HTML. בתוכו שני אלמנטים ראשיים — <code>&lt;head&gt;</code> ו-<code>&lt;body&gt;</code>. בתוך ה-body יש אלמנטים כמו <code>div, h1, img, p</code> וכן הלאה. <strong>כל אלמנט הוא אובייקט</strong> בעץ, ול-JS יש זכות גישה לאובייקטים האלה.</p></div>\n<div class=\"box must\"><span class=\"box-label\">★ שינוי המסמך דרך DOM</span>\n<p>כל אלמנט יכול לשנות את התכונות (properties) של האובייקטים ולשנות את העץ עצמו. למשל:</p>\n<p><strong>גישה לאלמנט:</strong> <code>document.getElementById(\"myDiv\")</code> מקבל את האובייקט של div עם <code>id=\"myDiv\"</code>.</p>\n<p><strong>שינוי תוכן:</strong> התכונה <code>innerHTML</code> — <code>div.innerHTML = \"&lt;p&gt;טקסט חדש&lt;/p&gt;\"</code> כותבת HTML חדש לתוך האלמנט, והדפדפן מייצר עבורו אובייקטים חדשים בעץ.</p></div>\n<div class=\"box must\"><span class=\"box-label\">★ העץ הוא דינמי!</span>\n<p>נקודה מרכזית שנבחנת: העץ הוא <strong>דינמי</strong> — אם משנים אותו (למשל דרך <code>innerHTML</code>), <strong>זה משנה מיד את מה שרואים על המסך</strong>. באמצעות JS ניתן לשנות את כל התכונות, כולל את התוכן עצמו ואת האלמנטים בעץ. כך אתרים משתנים בלי לטעון מחדש את הדף.</p></div>\n<div class=\"box\"><span class=\"box-label\">דוגמת שימוש</span>\n<p>לחיצה על כפתור → JS מוצאת אלמנט → משנה את ה-innerHTML שלו → הדף מתעדכן. זהו הבסיס לאינטראקטיביות: JS + DOM מאפשרים לשנות את הדף בתגובה לפעולות המשתמש, בלי בקשה חדשה לשרת.</p></div>",
"<p><strong>מהו JSON?</strong> <span class=\"en\">JSON</span> (<span class=\"en\">JavaScript Object Notation</span>) — פורמט טקסט להעברת נתונים, מבוסס על תחביר אובייקטים של JavaScript. משמש להעברת מידע בין ה-Front-end ל-Back-end, וברוב המקרים זה מה ש-<code>fetch</code> מקבל בחזרה.</p>\n<div class=\"box must\"><span class=\"box-label\">★ כללי תחביר של JSON (נבחן!)</span>\n<p>• שמות של תכונות (keys) צריכים <strong>גרשיים כפולים</strong> (<code>\"</code>) — לא גרש בודד.<br>• ערך (value) יכול להיות: אובייקט, מערך, או סתם <span class=\"en\">string</span>.<br>• <strong>סוגריים מסולסלים <code>{ }</code> = אובייקט</strong>.<br>• <strong>סוגריים מרובעים <code>[ ]</code> = מערך</strong>.<br>• הפורמט <strong>סלחני לשגיאות? לא!</strong> JSON <em>לא</em> סלחן — שגיאת תחביר פוסלת את כל המסמך (בניגוד ל-HTML).</p>\n<p>דוגמה: <code>{ \"name\": \"Dan\", \"age\": 25, \"hobbies\": [\"code\",\"music\"] }</code></p></div>\n<div class=\"box must\"><span class=\"box-label\">★ תפקיד fetch ב-JavaScript</span>\n<p><strong><span class=\"en\">fetch</span></strong> היא מתודה שנותנת אפשרות לקבל נתונים נוספים מהאינטרנט <em>בזמן שהמשתמשים כבר משתמשים בדף</em> — בלי לטעון מחדש את הדף! היא יכולה לתקשר עם ה-backend. אם משהו כבר מוצג ב-HTML, JS עם fetch יכולה לקבל נתונים נוספים ולשנות את מה שמוצג.</p>\n<p>החשיבות: fetch מאפשרת לבנות דברים נוספים ולעדכן חלקים בדף <strong>בלי לעבור לדף אחר</strong>. מפעילים אותה בהתאם לאירועים (events).</p></div>\n<div class=\"box\"><span class=\"box-label\">שימוש ב-fetch</span>\n<p>כותבים <code>fetch</code> ואחריו ה-URL של המשאב שרוצים:</p>\n<p><code>fetch(\"https://api.example.com/users\")</code></p>\n<p>ה-URL יכול להיות כתובת עצמה או שם קובץ אחר. מה שמקבלים בחזרה הוא ברוב המקרים <strong>JSON</strong>. אחר כך משתמשים ב-<code>.then()</code> כדי לעבד את הנתונים שהתקבלו:</p>\n<p><code>fetch(\"...\")</code><br><code>&nbsp;&nbsp;.then(response =&gt; response.json())</code></p>\n<p><code>.then</code> מקבל פונקציה (לרוב anonymous) שרצה כשהנתונים חוזרים — כי הבקשה היא <em>אסינכרונית</em>.</p></div>",
"<p><strong>מהו Node.js?</strong> <span class=\"en\">Node.js</span> היא <em>סביבה להרצת JavaScript מחוץ לדפדפן</em>. השימוש העיקרי: שירותי <strong>Back-end</strong>. הרעיון — \"JavaScript בכל מקום\" (Full-stack JS). נוצר ב-2009 על ידי <span class=\"en\">Ryan Dahl</span>. חברות כמו Uber, PayPal, Walmart ו-Netflix משתמשות בו.</p>\n<div class=\"box must\"><span class=\"box-label\">★ הרעיון מאחורי Node.js</span>\n<p>Node מבצע עיבוד <strong>אסינכרוני על thread יחיד</strong> (single thread) במקום עיבוד רב-threaded קלאסי. כך הוא ממזער תקורה (overhead) והשהיה (latency), וממקסם מדרגיות (scalability).</p>\n<ul>\n<li><strong>יתרון:</strong> אידיאלי לאפליקציות שמשרתות <em>הרבה בקשות</em> אבל לא צריכות הרבה כוח חישוב לכל בקשה. פחות בעיות של concurrency.</li>\n<li><strong>חיסרון:</strong> <span class=\"en\">Don't use for CPU intensive apps</span> — גרוע לעיבודים כבדים כמו חישובים מתמטיים מורכבים, מערכות נתונים גדולות, data science, או חישוב מקבילי מסיבי.</li></ul></div>\n<div class=\"box must\"><span class=\"box-label\">★ JS בדפדפן מול JS ב-Node</span>\n<p>אותה שפה, אבל אובייקטים גלובליים שונים:</p>\n<div class=\"scroll\"><table><thead><tr><th>בדפדפן</th><th>ב-Node</th></tr></thead><tbody>\n<tr><td><code>window</code></td><td><code>global</code></td></tr>\n<tr><td><code>location</code></td><td><code>require</code></td></tr>\n<tr><td><code>document</code></td><td><code>module</code></td></tr>\n</tbody></table></div>\n<p>בדפדפן יש גישה ל-DOM (document); ב-Node אין DOM אבל יש גישה למערכת הקבצים, לרשת ועוד.</p></div>\n<div class=\"box\"><span class=\"box-label\">מודולים מובנים (Built-in modules)</span>\n<p>Node מגיע עם מודולים מובנים לגישה לפונקציות מערכת: גישה לפונקציות מערכת הפעלה (OS), טיפול בקבצים (file), לולאת אירועים (events), ובקשות/שירות HTTP. טוענים מודול עם <code>require</code>: <code>const http = require(\"http\");</code></p></div>\n<div class=\"box\"><span class=\"box-label\">npm — מנהל החבילות</span>\n<p><span class=\"en\">npm</span> (Node Package Manager) מתקין חבילות חיצוניות. למשל <code>npm install mysql</code> מתקין את הדרייבר ל-MySQL. החבילות נשמרות בתיקיית <code>node_modules</code>.</p></div>",
"<p><strong>מהו Express?</strong> <span class=\"en\">Express.js</span> היא ספריית framework פופולרית ל-Node.js שמפשטת בניית שרתי web ו-APIs — ניתוב בקשות (routing), טיפול ב-requests ו-responses, middleware ועוד. במקום לכתוב שרת HTTP גולמי, Express נותן תחביר נוח.</p>\n<div class=\"box\"><span class=\"box-label\">Routing — ניתוב</span>\n<p>Express מגדיר איזה קוד ירוץ עבור כל כתובת (route) ושיטת בקשה (GET, POST). למשל <code>app.get(\"/users\", (req, res) =&gt; { ... })</code> — כשמגיעה בקשת GET ל-<code>/users</code>, הפונקציה רצה ו-<code>res.send(...)</code> מחזירה תשובה ללקוח.</p></div>\n<div class=\"box must\"><span class=\"box-label\">★ שימוש בבסיסי נתונים ב-Node.js</span>\n<p>בבניית Back-end מתחברים למסד נתונים (DB). <strong><span class=\"en\">Connection</span></strong> הוא הקשר עם ה-DB — דרך Connection אחד ניתן לשלוח כל שאילתה. השלבים:</p>\n<ol class=\"steps\">\n<li><strong>התקנת דרייבר:</strong> <code>npm install mysql</code></li>\n<li><strong>טעינת המודול:</strong> <code>const mysql = require(\"mysql\");</code></li>\n<li><strong>יצירת חיבור:</strong> <code>const con = mysql.createConnection({ host, user, password, database });</code></li>\n<li><strong>הרצת שאילתה:</strong> <code>con.query(sql, function(err, result) { ... })</code></li></ol></div>\n<div class=\"box\"><span class=\"box-label\">הרצת שאילתות SQL</span>\n<p><strong>הכנסה (INSERT):</strong><br><code>const sql = \"INSERT INTO customers (name, address) VALUES ('Inc', 'Highway 37')\";</code><br><code>con.query(sql, function(err, result) { if(err) throw err; });</code></p>\n<p><strong>שליפה (SELECT):</strong><br><code>const sql = \"SELECT * FROM customers\";</code><br><code>con.query(sql, function(err, result) { res.send(result); });</code></p>\n<p>ה-<code>query</code> מקבל את השאילתה ופונקציית callback שרצה כשהתוצאה חוזרת (אסינכרוני). זהירות מ-SQL Injection — משתמשים בפרמטרים במקום לשרשר קלט משתמש ישירות.</p></div>",
"<p><strong>הבעיה: HTTP הוא stateless.</strong> פרוטוקול <span class=\"en\">HTTP</span> הוא <em>חסר מצב</em> (stateless) — השרת <strong>לא שומר מידע על הלקוחות</strong>. אין מידע הקשרי על הלקוח, ואין דרך לקשר בין בקשות שונות מאותו לקוח. בקיצור: <strong>לפרוטוקול אין זיכרון</strong> של אירועים קודמים.</p>\n<div class=\"box\"><span class=\"box-label\">הפתרון</span>\n<p>נדרש פתרון ש<em>יושב מעל</em> פרוטוקול ה-HTTP ויעזור לשמור מידע על המצב (state). שני המנגנונים: <strong>Cookies</strong> ו-<strong>Session</strong>.</p></div>\n<div class=\"box must\"><span class=\"box-label\">★ Cookies (עוגיות)</span>\n<p><strong>Cookie</strong> הוא פיסת מידע קטנה שהשרת שומר <em>אצל הדפדפן של המשתמש</em>. בכל בקשה הדפדפן שולח את ה-cookie בחזרה לשרת — כך השרת \"מזהה\" מי הלקוח. שימושים: זיהוי משתמש, העדפות, מעקב. ה-cookie נשמר בצד הלקוח (client-side).</p></div>\n<div class=\"box must\"><span class=\"box-label\">★ Session</span>\n<p><strong>Session</strong> היא הדרך להתייחס למשתמשים שונים בצורה שונה. היא מבוססת על cookie, אבל <strong>מנגנון נוח יותר</strong> לבניית תגובה אישית לכל לקוח. הנתונים נשמרים ב-session בצד ה<em>שרת</em>, וכל משתמש מקבל session משלו עם נתונים שונים.</p>\n<p>לכל משתמש נפתח session משלו, ואז אפשר לשמור נתונים שונים למשתמשים שונים. <strong>לאפליקציות עם LOG IN חובה להשתמש ב-session</strong> — הוא באופן טבעי הכי נוח, אבל לא רק לזה.</p></div>\n<div class=\"box must\"><span class=\"box-label\">★ מתי session מסתיים? (נבחן!)</span>\n<p>שתי סיבות לסיום session:</p><ol class=\"steps\">\n<li><strong>LOG OUT</strong> — יש פונקציה <code>session.destroy</code> שנותנת אפשרות לעצור את ה-session (וגם מסיבות אחרות).</li>\n<li><strong>TIMEOUT</strong> — לכל session יש זמן שנקרא TIMEOUT: אם עבר יותר מהזמן הזה בלי שום פעולה של המשתמש מול האפליקציה, ה-session <strong>נסגר אוטומטית</strong>.</li></ol></div>\n<div class=\"box trap\"><span class=\"box-label\">⚠ נקודות חשובות</span>\n<p>• HTTP חסר מצב — זו הסיבה שצריך cookies/session מלכתחילה.<br>• Session מבוססת על cookie אבל נוחה יותר.<br>• לוגין מחייב session.<br>• Session מסתיים ב-logout או ב-timeout (חוסר פעילות).</p></div>",
"<p>ריכוז של ההבחנות, המלכודות והנוסחאות שהכי סביר שייבחנו. עבור על זה ביום המבחן.</p>\n<div class=\"box must\"><span class=\"box-label\">★ טבלת הבחנות מרכזית</span>\n<div class=\"scroll\"><table><thead><tr><th>מושג</th><th>נקודה קריטית</th></tr></thead><tbody>\n<tr><td>HTML</td><td>סלחני לשגיאות — המסמך מוצג בכל זאת</td></tr>\n<tr><td>JSON</td><td><em>לא</em> סלחני; keys בגרשיים כפולים; {}=אובייקט, []=מערך</td></tr>\n<tr><td>Front vs Back</td><td>Front=דפדפן (HTML/CSS/JS); Back=שרת (DB, לוגיקה)</td></tr>\n<tr><td>Inline/Internal/External CSS</td><td>חיצוני = הכי טוב (שימוש חוזר)</td></tr>\n<tr><td>ספציפיות CSS</td><td>Id &gt; Class &gt; Element (Id מנצח)</td></tr>\n<tr><td>var/let/const</td><td>var=פונקציה (מיושן); let=בלוק; const=בלוק+קבוע</td></tr>\n<tr><td>fetch</td><td>נתונים בלי טעינה מחדש; מחזיר JSON; אסינכרוני</td></tr>\n<tr><td>Node.js</td><td>JS מחוץ לדפדפן; single-thread async; לא ל-CPU כבד</td></tr>\n<tr><td>HTTP</td><td>Stateless — אין זיכרון בין בקשות</td></tr>\n<tr><td>Session</td><td>מבוססת cookie; חובה ללוגין; מסתיימת ב-logout/timeout</td></tr>\n</tbody></table></div></div>\n<div class=\"box\"><span class=\"box-label\">אלמנטים סמנטיים של HTML5</span>\n<p>header, footer, nav, main, article, section, aside, figure — נותנים משמעות למבנה. Sectioning: article, section, nav, aside.</p></div>\n<div class=\"box\"><span class=\"box-label\">JS בדפדפן מול Node</span>\n<p>דפדפן: window, location, document. Node: global, require, module.</p></div>\n<div class=\"box\"><span class=\"box-label\">חיבור ל-DB ב-Node</span>\n<p>require(\"mysql\") → createConnection({host,user,password,database}) → con.query(sql, callback). Connection = הקשר עם ה-DB.</p></div>"];

  BANK.forEach(topic => { if (EXTRA[topic.name]) topic.qs = topic.qs.concat(EXTRA[topic.name]); });
})();
const TC = ['t0','t1','t2','t3','t4','t5','t6','t7','t8','t9'];

/* ============ PERSISTENCE (localStorage) ============ */
const STORE_KEY = 'cloud_progress_v1';
function loadStore(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {res:{}, stars:{}}; }
  catch(e){ return {res:{}, stars:{}}; }
}
function saveStore(s){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){} }
let STORE = loadStore();
// stable id per question: topic index + short hash of its text
function qid(ti, q){
  let h=0; const s=(q.q||'')+(q.o?q.o.join('|'):'');
  for(let i=0;i<s.length;i++){ h=((h<<5)-h+s.charCodeAt(i))|0; }
  return ti+'_'+(h>>>0).toString(36);
}
// Leitner spaced-repetition intervals (in days) per box level 0..5
const SR_INTERVALS=[0,1,2,4,7,14];
function todayNum(){ return Math.floor(Date.now()/86400000); }
function recordResult(ti,q,hit){
  const id=qid(ti,q);
  const r=STORE.res[id]||{c:0,w:0,ti:ti,box:0};
  if(hit) r.c++; else r.w++;
  r.last=hit?1:0; r.ti=ti;
  // spaced repetition: correct -> advance a box (longer gap); wrong -> reset to box 0 (see tomorrow)
  if(typeof r.box!=='number') r.box=0;
  if(hit){ r.box=Math.min(5, r.box+1); } else { r.box=0; }
  r.due = todayNum() + SR_INTERVALS[r.box];
  r.seen = todayNum();
  STORE.res[id]=r; saveStore(STORE);
}
// questions that are "due" for review today (seen before, and due date reached), weakest first
function dueQuestions(){
  const t=todayNum(); const out=[];
  BANK.forEach((tp,ti)=> tp.qs.forEach(q=>{
    const r=STORE.res[qid(ti,q)];
    if(r && r.seen!=null && (r.due==null || r.due<=t)) out.push({q,ti,box:(r.box||0)});
  }));
  out.sort((a,b)=>a.box-b.box); // weakest (lowest box) first
  return out;
}
// questions never seen yet
function newQuestions(){
  const out=[];
  BANK.forEach((tp,ti)=> tp.qs.forEach(q=>{
    const r=STORE.res[qid(ti,q)];
    if(!r || r.seen==null) out.push({q,ti});
  }));
  return out;
}
function toggleStar(ti,q){
  const id=qid(ti,q);
  if(STORE.stars[id]){ delete STORE.stars[id]; } else { STORE.stars[id]={ti:ti}; }
  saveStore(STORE); return !!STORE.stars[id];
}
function isStarred(ti,q){ return !!STORE.stars[qid(ti,q)]; }
// topic stats from stored results (based on most-recent answer per question)
function topicStats(ti){
  let c=0,w=0;
  Object.keys(STORE.res).forEach(id=>{
    const r=STORE.res[id];
    if(r.ti===ti){ if(r.last===1) c++; else w++; }
  });
  return {c, w, total:c+w};
}
// all questions the user got wrong on their most recent attempt
function wrongQuestions(){
  const out=[];
  BANK.forEach((t,ti)=> t.qs.forEach(q=>{
    const r=STORE.res[qid(ti,q)];
    if(r && r.last===0) out.push({q, ti});
  }));
  return out;
}
function starredQuestions(){
  const out=[];
  BANK.forEach((t,ti)=> t.qs.forEach(q=>{
    if(STORE.stars[qid(ti,q)]) out.push({q, ti});
  }));
  return out;
}

/* ============ MASTERY & SMART LEARNING ============ */
// Ensure store has an exams history array
if(!STORE.exams) STORE.exams=[];
// Per-question mastery state: 'new' (never seen), 'weak' (last wrong / more wrong than right),
// 'learning' (some right), 'mastered' (>=2 consecutive-ish rights, last right).
function qState(ti,q){
  const r=STORE.res[qid(ti,q)];
  if(!r) return 'new';
  if(r.last===0) return 'weak';
  if(r.c>=2 && r.w===0) return 'mastered';
  if(r.c>=3 && r.c>r.w*2) return 'mastered';
  return 'learning';
}
// Topic mastery %: weighted — mastered=1, learning=0.5, weak/new=0, over all questions in topic
function topicMastery(ti){
  const qs=BANK[ti].qs; if(!qs.length) return null;
  let s=0;
  qs.forEach(q=>{ const st=qState(ti,q); s+= st==='mastered'?1: st==='learning'?0.5:0; });
  return Math.round(100*s/qs.length);
}
// Overall readiness across all question-topics
function overallReadiness(){
  let s=0,n=0;
  META.forEach((mt,ti)=>{ if(BANK[ti].qs.length){ const m=topicMastery(ti); if(m!=null){ s+=m; n++; } } });
  return n? Math.round(s/n):0;
}
// Count questions by state across everything
function stateCounts(){
  const c={'new':0,'weak':0,'learning':0,'mastered':0};
  META.forEach((mt,ti)=> BANK[ti].qs.forEach(q=> c[qState(ti,q)]++));
  return c;
}
// Build a SMART practice queue: prioritise weak, then new, then learning, then a few mastered.
// Interleave topics so it doesn't feel repetitive.
function smartQueue(limit){
  const buckets={weak:[],'new':[],learning:[],mastered:[]};
  META.forEach((mt,ti)=> BANK[ti].qs.forEach(q=> buckets[qState(ti,q)].push({q,ti})));
  // shuffle each bucket
  ['weak','new','learning','mastered'].forEach(k=> shuffleArr(buckets[k]));
  const ordered=[...buckets.weak,...buckets['new'],...buckets.learning,...buckets.mastered];
  const picked = (typeof limit==='number') ? ordered.slice(0,limit) : ordered;
  return spreadTopics(picked);
}
function shuffleArr(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
// reorder so consecutive items avoid same topic where possible
function spreadTopics(items){
  const out=[]; const pool=items.slice();
  let lastTi=-1;
  while(pool.length){
    let idx=pool.findIndex(x=>x.ti!==lastTi);
    if(idx<0) idx=0;
    out.push(pool[idx]); lastTi=pool[idx].ti; pool.splice(idx,1);
  }
  return out;
}
function recordExam(score,total,perTopic){
  STORE.exams.push({t:Date.now(), score:score, total:total, pct:Math.round(100*score/total), per:perTopic});
  if(STORE.exams.length>20) STORE.exams=STORE.exams.slice(-20);
  saveStore(STORE);
}

/* ============ STUDY PLAN — 6-day countdown + daily dose ============ */
// exam day stored as a day-number; defaults to today+6 on first run
function examDay(){
  if(STORE.examDay==null){ STORE.examDay = todayNum()+6; saveStore(STORE); }
  return STORE.examDay;
}
function setExamInDays(d){ STORE.examDay = todayNum()+Math.max(0,d); saveStore(STORE); }
function daysLeft(){ return Math.max(0, examDay()-todayNum()); }
// track that the user practised today (for streak + daily-dose "done")
if(!STORE.days) STORE.days={};
function markPractisedToday(){
  const k=String(todayNum());
  STORE.days[k]=(STORE.days[k]||0)+1;
  saveStore(STORE);
}
function practisedToday(){ return STORE.days[String(todayNum())]||0; }
function streak(){
  let s=0, d=todayNum();
  // count back consecutive days with activity (today counts if practised)
  while(STORE.days[String(d)]){ s++; d--; }
  return s;
}
// The daily plan: all reviews due today + a fair share of the still-new questions
// spread across the days remaining, so everything gets seen before the exam.
function dailyPlan(){
  const due=dueQuestions();
  const fresh=newQuestions();
  const dl=Math.max(1, daysLeft());
  // spread new questions evenly across remaining days (front-load slightly)
  const perDay=Math.ceil(fresh.length/dl);
  const newToday=fresh.slice(0, perDay);
  const items=spreadTopics([...due, ...newToday]);
  return {items, due:due.length, fresh:fresh.length, newTarget:newToday.length, perDay};
}
let dailyItems=null;
function startDaily(){
  const plan=dailyPlan();
  dailyItems = plan.items.length ? plan.items : smartQueue(15);
  setMode('review');
}

      // breakdowns (with •/✓/✗ markers or "טענה N") that don't read as standalone facts.
      // The base questions already cover the same teaching points cleanly.
      if(/טענה\s*\d/.test(w) || /[✓✗]/.test(w) || /שלוש נכונות/.test(w) || /כל הטענות נכונות/.test(w)) return;
      // strip HTML tags -> plain text of the full explanation
      let txt=w.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
      txt=txt.replace(/^הנכונה:?\s*/,'').replace(/^השגויה:?\s*/,'');
      // drop leading "<service>." label if the sentence continues after it
      // keep only sentences that actually teach (length filter), split to first 1-2 sentences
      let parts=txt.split(/(?<=[.!])\s+/).filter(s=>s.trim().length>0);
      // choose the most informative sentence: prefer one with an explanatory marker or >30 chars
      let pick='';
      for(const s of parts){
        const c=s.trim();
        if(c.length>=28){ pick=c; break; }
      }
      if(!pick && parts.length){ pick=parts.map(s=>s.trim()).join(' '); }
      // if still short/among the trivial answer-labels, append the next sentence for context
      if(pick.length<28 && parts.length>1){ pick=(parts[0]+' '+parts[1]).trim(); }
      // if the pick is just a "Name (Expansion)." label with few words, pull in more context
      const wordCount=pick.replace(/[()\/.,]/g,' ').split(/\s+/).filter(Boolean).length;
      if(wordCount<6 && parts.length){

function buildCard(q,qi,label,badge,onPick,ti){
  const card=document.createElement('div');

  top.innerHTML=h;

    star.title='סמן לחזרה';

  }
  card.appendChild(top);

  // option order (may be shuffled): array of original indices
  const order=q._order || q.o.map((_,i)=>i);

  ul.className='opts';
  order.forEach((origIdx,pos)=>{
    const li=document.createElement('li');

    btn.addEventListener('click',()=>onPick(card,q,origIdx,order));
    li.appendChild(btn); ul.appendChild(li);
  });
  card.appendChild(ul);
  const why=document.createElement('div');
  why.className='why'; why.hidden=true;
  why.innerHTML='<span class="tag"></span><div>'+q.why+'</div>';
  card.appendChild(why);
  return card;
}

function markCard(card,q,chosenOrig,order){
  card.dataset.done='1';
  const btns=card.querySelectorAll('.opt');
  order.forEach((origIdx,pos)=>{
    const b=btns[pos];
    b.disabled=true;
    if(origIdx===q.a) b.classList.add(origIdx===chosenOrig?'correct':'reveal');
    else if(origIdx===chosenOrig) b.classList.add('wrong');
  });
  const hit=chosenOrig===q.a;
  const why=card.querySelector('.why');
  const correctPos=order.indexOf(q.a);
  why.hidden=false;
  why.classList.toggle('miss',!hit);
  why.querySelector('.tag').textContent = hit ? '✓ נכון' : '✗ לא נכון — התשובה היא '+KEYS[correctPos];
  return hit;
}

const examEl=document.getElementById('exam');

function shuffle(a){ // Fisher–Yates
  const r=a.slice();
  for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}
  return r;
}

const EXAM_N = 20; // exam draws 20 random questions, different each time
function buildExam(){
  // gather all questions across every topic, then draw EXAM_N at random,
  // shuffle question order, and shuffle each question's option order
  let all=[];
  META.forEach((mt,ti)=>{
    BANK[ti].qs.forEach((q,qi)=> all.push({q,ti,qi}));
  });
  let picked=shuffle(all).slice(0, Math.min(EXAM_N, all.length));
  // attach a fresh shuffled option order to each drawn question (clone!)
  return picked.map(p=>{
    const clone=Object.assign({},p.q);
    const identity=p.q.o.map((_,i)=>i);
    clone._order = p.q.noshuffle ? identity : shuffle(identity);
    return {q:clone, ti:p.ti};
  });
}

function startExam(){
  exam={items:buildExam(),answers:[],idx:0,remaining:30*60};
  renderExam();
  clearInterval(timerId);

function tick(){

    const m=Math.floor(exam.remaining/60), s=exam.remaining%60;
    t.querySelector('b').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');

}

  if(dailyItems){

  if(smartItems){
    const items=smartItems; smartItems=null; // consume
    const head=document.createElement('div');
    head.className='review-head';
    const wc=items.filter(x=>qState(x.ti,x.q)==='weak').length;
    const nc=items.filter(x=>qState(x.ti,x.q)==='new').length;
    head.innerHTML='<h2>🎯 תרגול חכם</h2><p>סדר השאלות הותאם אליך: קודם מה שטעית בו ('+wc+'), אחר כך שאלות חדשות ('+nc+'), ואז חיזוק. תרגל/י ברצף — כל תשובה מעדכנת את המוכנות שלך.</p>';
    reviewEl.appendChild(head);
    if(!items.length){
      const e=document.createElement('div'); e.className='review-empty';
      e.innerHTML='<div class="ic">✓</div><h3>הכול נראה טוב!</h3><p>אין כרגע שאלות שדורשות תרגול. נסה/י מבחן מסכם כדי לאתגר את עצמך.</p>';
      reviewEl.appendChild(e); return;
    }
    items.forEach((it,qi)=> reviewEl.appendChild(buildCard(it.q,qi,META[it.ti][0].split(' — ')[0],null,onStudyPick,it.ti)));
    const done=document.createElement('div'); done.className='smart-done';
    done.innerHTML='<b>סיימת את הסבב 🎉</b><br><button class="btn primary" id="smartAgain">עוד סבב חכם</button> <button class="btn ghost2" id="smartToDash">חזרה למרכז</button>';
    reviewEl.appendChild(done);
    document.getElementById('smartAgain').addEventListener('click',startSmart);
    document.getElementById('smartToDash').addEventListener('click',()=>setMode('dash'));
    return;
  }

  const wrong=wrongQuestions();
  const starred=starredQuestions();

  // header with summary
  const head=document.createElement('div');
  head.className='review-head';
  head.innerHTML='<h2>תרגול ממוקד</h2><p>כאן מרוכזות השאלות שטעית בהן, ואלה שסימנת בכוכב — בדיוק מה שכדאי לחזור עליו לפני המבחן.</p>';
  reviewEl.appendChild(head);

  if(wrong.length===0 && starred.length===0){
    const empty=document.createElement('div');
    empty.className='review-empty';
    empty.innerHTML='<div class="ic">✓</div><h3>אין כאן עדיין כלום</h3><p>ברגע שתטעה בשאלה, או תסמן שאלה בכוכב (★), היא תופיע כאן לתרגול חוזר.<br>התחל ב<b>לימוד לפי נושא</b> או ב<b>מבחן מסכם</b>.</p>';
    reviewEl.appendChild(empty);
    return;
  }

  // WRONG questions section
  if(wrong.length){
    const sec=document.createElement('div');
    sec.className='part b';
    sec.innerHTML='<span class="lbl" style="background:var(--flag)">✗ טעויות</span><h2>שאלות שטעית בהן — '+wrong.length+'</h2>';
    reviewEl.appendChild(sec);
    const hint=document.createElement('p');
    hint.className='topline';
    hint.textContent='ענה שוב. שאלה שתענה נכון תוסר מהרשימה בפעם הבאה שתיכנס לכאן.';
    reviewEl.appendChild(hint);
    wrong.forEach((it,i)=>{
      const badge={name:META[it.ti][0].split(' ')[0], hue:TC[it.ti]};
      const card=buildCard(it.q,i,'שאלה '+(i+1),badge,onReviewPick,it.ti);
      card.classList.add('tc'+it.ti);
      reviewEl.appendChild(card);
    });
  }

  // STARRED questions section
  if(starred.length){
    const sec=document.createElement('div');
    sec.className='part b';
    sec.innerHTML='<span class="lbl" style="background:var(--warn);color:#3a2a00">★ מסומנות</span><h2>שאלות שסימנת — '+starred.length+'</h2>';
    reviewEl.appendChild(sec);
    starred.forEach((it,i)=>{
      const badge={name:META[it.ti][0].split(' ')[0], hue:TC[it.ti]};
      const card=buildCard(it.q,i,'שאלה '+(i+1),badge,onReviewPick,it.ti);
      card.classList.add('tc'+it.ti);
      reviewEl.appendChild(card);
    });
  }
}

function onReviewPick(card,q,chosenOrig,order){
  if(card.dataset.done) return;
  const hit=markCard(card,q,chosenOrig,order);
  if(card.dataset.ti!=null) { recordResult(+card.dataset.ti,q,hit); refreshTabStats(); }
}

function showExamStart(){
  examEl.innerHTML='';
  const s=document.createElement('div');
  s.className='exam-start';
  let leg='';
  META.forEach((mt,ti)=> leg+='<span><span class="dot" style="background:var(--'+TC[ti]+')"></span>'+mt[0]+'</span>');
  s.innerHTML=
    '<h2>מבחן מסכם — 20 שאלות</h2>'+
    '<p>20 שאלות נבחרות באקראי מכל 9 הנושאים. בכל ניסיון — <b style="color:var(--ink)">שאלות אחרות וסדר תשובות אחר</b>, כדי שתתרגל את החומר ולא את המיקום. מתוך מאגר של 43 שאלות.</p>'+
    '<div class="exam-legend">'+leg+'</div>'+
    '<p style="font-size:.85rem;color:var(--drop)">טיימר: 30 דקות · לחיצה על תשובה חושפת את הפתרון מיד</p>'+
    '<button class="btn" id="beginExam" type="button">התחל מבחן</button>';
  examEl.appendChild(s);
  document.getElementById('beginExam').addEventListener('click',startExam);
}
mDash.addEventListener('click',()=>setMode('dash'));
mStudy.addEventListener('click',()=>setMode('study'));
mCards.addEventListener('click',()=>setMode('cards'));
mReview.addEventListener('click',()=>setMode('review'));
mExam.addEventListener('click',()=>setMode('exam'));
// start on the prep dashboard
setMode('dash');
</script>
</body>
